<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <defs>
    <radialGradient id="crestGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Golden Rice Stalks (Padi) -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Rice Stalk Left -->
  <g fill="#d97706" opacity="0.9">
    <path d="M 45,130 C 35,100 45,65 70,45 C 68,55 60,75 60,95 C 60,110 52,122 45,130 Z" />
    <circle cx="48" cy="115" r="4" fill="#f59e0b" />
    <circle cx="45" cy="100" r="4.5" fill="#f59e0b" />
    <circle cx="46" cy="85" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="70" r="4" fill="#f59e0b" />
    <circle cx="62" cy="56" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Rice Stalk Right -->
  <g fill="#d97706" opacity="0.9">
    <path d="M 155,130 C 165,100 155,65 130,45 C 132,55 140,75 140,95 C 140,110 148,122 155,130 Z" />
    <circle cx="152" cy="115" r="4" fill="#f59e0b" />
    <circle cx="155" cy="100" r="4.5" fill="#f59e0b" />
    <circle cx="154" cy="85" r="4.5" fill="#f59e0b" />
    <circle cx="148" cy="70" r="4" fill="#f59e0b" />
    <circle cx="138" cy="56" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Central Shield -->
  <path d="M 68,52 L 132,52 Q 132,105 100,135 Q 68,105 68,52 Z" fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Green Crescent Field -->
  <path d="M 74,58 L 126,58 Q 126,98 100,124 Q 74,98 74,58 Z" fill="#15803d" opacity="0.4" />

  <!-- Kedah Crescent & Shield Emblem -->
  <!-- Crescent -->
  <path d="M 98,68 A 18,18 0 0,0 112,94 A 15,15 0 0,1 98,68 Z" fill="#fbbf24" />
  <!-- Star -->
  <polygon points="100,62 102,68 108,68 103,72 105,78 100,74 95,78 97,72 92,68 98,68" fill="#fbbf24" />
  
  <!-- Crossed Keris / Shield Motif -->
  <circle cx="100" cy="98" r="14" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
  <path d="M 92,98 L 108,98 M 100,90 L 100,106" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Ribbon at Bottom -->
  <g filter="url(#shadow)">
    <path d="M 35,142 L 55,134 L 55,148 Z" fill="#1e3a8a" />
    <path d="M 165,142 L 145,134 L 145,148 Z" fill="#1e3a8a" />
    <path d="M 45,138 Q 100,126 155,138 L 150,158 Q 100,146 50,158 Z" fill="url(#ribbonGrad)" stroke="#fbbf24" stroke-width="1" />
    <text x="100" y="151" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" letter-spacing="0.5">MAJLIS BANDARAYA ALOR SETAR</text>
  </g>
</svg>

