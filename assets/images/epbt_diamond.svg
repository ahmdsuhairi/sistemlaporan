<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22">
  <defs>
    <linearGradient id="silverDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="innerDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Outer Diamond Pattern (ePBT classic logo style) -->
  <polygon points="16,2 30,16 16,30 2,16" fill="url(#silverDiamond)" stroke="#475569" stroke-width="1"/>
  <!-- Inner 4 Quadrant Diamond Cuts -->
  <polygon points="16,5 27,16 16,16" fill="#f8fafc" opacity="0.9"/>
  <polygon points="16,16 27,16 16,27" fill="#cbd5e1" opacity="0.8"/>
  <polygon points="5,16 16,16 16,27" fill="#64748b" opacity="0.9"/>
  <polygon points="16,5 16,16 5,16" fill="#94a3b8" opacity="0.8"/>
  <!-- Center Accent Gem -->
  <polygon points="16,9 23,16 16,23 9,16" fill="url(#innerDiamond)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>

